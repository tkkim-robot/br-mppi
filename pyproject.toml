[project]
name = "br-mppi"
version = "0.1.0"
description = "Barrier-rate guided MPPI obstacle-avoidance examples."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "matplotlib>=3.8,<3.9",
    "jax>=0.5.3",
    "optuna>=4.2,<5",
    "PyYAML>=6.0,<7",
    "wandb>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
