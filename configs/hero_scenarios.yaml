# Hero Scenarios for BR-MPPI Evaluation
# Each scenario defines a deterministic obstacle field, start state, and goal.
# If start_state or goal are omitted, the robot's default_state and default_goal are used.

narrow_passage:
  robot: unicycle
  description: "A narrow opening between two large obstacles."
  start_state: [-7.0, 0.0, 0.0]
  goal: [7.0, 0.0]
  obstacles:
    - {center: [0.0, 2.5], radius: 2.0}
    - {center: [0.0, -2.5], radius: 2.0}

slalom:
  robot: unicycle
  description: "A sequence of staggered obstacles requiring tight turns."
  start_state: [-8.0, 0.0, 0.0]
  goal: [8.0, 0.0]
  obstacles:
    - {center: [-4.0, 1.5], radius: 1.0}
    - {center: [0.0, -1.5], radius: 1.0}
    - {center: [4.0, 1.5], radius: 1.0}

local_trap:
  robot: unicycle
  description: "A U-shaped trap that requires early avoidance to prevent getting stuck."
  start_state: [-6.0, 0.0, 0.0]
  goal: [6.0, 0.0]
  obstacles:
    - {center: [1.0, 1.5], radius: 0.8}
    - {center: [1.0, -1.5], radius: 0.8}
    - {center: [2.0, 0.0], radius: 0.8}
    - {center: [0.0, 2.0], radius: 0.8}
    - {center: [0.0, -2.0], radius: 0.8}

dense_clutter:
